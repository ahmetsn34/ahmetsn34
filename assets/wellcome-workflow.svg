<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Wellcome ISG Automation workflow overview</title>
  <desc id="desc">Personnel spreadsheets and local documents are validated and classified, then Selenium fills the portal and uploads documents. Processing results are written to Excel reports. This is a workflow diagram, not an application screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#12333E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity=".06"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#5EEAD4" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <path d="M0 0H1280" stroke="#2DD4BF" stroke-width="6"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="74" fill="#5EEAD4" font-size="23" font-weight="600" letter-spacing="3">WORKFLOW OVERVIEW</text>
    <text x="60" y="142" fill="#F1F5F9" font-size="48" font-weight="700">Wellcome ISG Automation</text>
    <text x="64" y="190" fill="#CBD5E1" font-size="26">From personnel records to portal workflows.</text>

    <g fill="#102435" stroke="#2D5966" stroke-width="2">
      <rect x="64" y="262" width="344" height="232" rx="20"/>
      <rect x="468" y="262" width="344" height="232" rx="20"/>
      <rect x="872" y="262" width="344" height="232" rx="20"/>
    </g>
    <g fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="92" y="293" width="42" height="48" rx="5"/>
      <path d="M103 307H123M103 317H123M103 327H116"/>
      <path d="M498 304L509 315L532 292M497 334H532"/>
      <rect x="901" y="292" width="48" height="42" rx="5"/>
      <path d="M901 303H949M919 315L925 309L931 315M925 310V327"/>
      <path d="M423 378H453" marker-end="url(#arrow)"/>
      <path d="M827 378H857" marker-end="url(#arrow)"/>
    </g>
    <g fill="#F1F5F9" font-size="30" font-weight="600">
      <text x="92" y="390">1. Prepare</text>
      <text x="496" y="390">2. Classify</text>
      <text x="900" y="390">3. Automate</text>
    </g>
    <g fill="#CBD5E1" font-size="24">
      <text x="92" y="432">Excel / CSV records</text>
      <text x="92" y="467">Local document folders</text>
      <text x="496" y="432">Validation + PDF / OCR</text>
      <text x="496" y="467">Keyword document rules</text>
      <text x="900" y="432">Portal forms + uploads</text>
      <text x="900" y="467">Selenium browser control</text>
    </g>
    <rect x="64" y="538" width="1152" height="78" rx="14" fill="#14333D" stroke="#2D5966"/>
    <circle cx="98" cy="577" r="7" fill="#2DD4BF"/>
    <text x="122" y="586" fill="#D1FAE5" font-size="26">Track progress, pause processing, and review Excel result reports.</text>
    <text x="64" y="672" fill="#94A3B8" font-size="22">PYTHON  /  CUSTOMTKINTER  /  SELENIUM  /  PANDAS</text>
  </g>
</svg>
